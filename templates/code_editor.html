<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor — {{ resource_id }} ({{ idwf }})</title>
    <link rel="stylesheet" href="/static/css/ace_editor.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: sans-serif; background: #1e1e1e; color: #d4d4d4; }

        /* Top bar */
        #topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            background: #2d2d2d;
            border-bottom: 1px solid #3e3e3e;
            font-size: 13px;
        }
        #topbar .label { color: #888; }
        #topbar .value { color: #ccc; font-weight: 500; }
        #topbar .sep { color: #555; }
        #topbar select, #topbar button {
            background: #3c3c3c;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 3px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        #topbar button:hover { background: #4a4a4a; }
        #topbar button.run { background: #0e639c; border-color: #0e639c; color: #fff; }
        #topbar button.run:hover { background: #1177bb; }
        #topbar .status { margin-left: auto; font-size: 12px; }
        #topbar .status.ok { color: #6a9955; }
        #topbar .status.err { color: #f44747; }

        /* 3-pane layout */
        #panes {
            display: grid;
            grid-template-rows: 50% 50%;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 36px);
        }

        /* Editor pane */
        #editor-pane {
            grid-column: 1 / -1;
            grid-row: 1;
            position: relative;
        }
        #editor {
            width: 100%;
            height: 100%;
            font-size: 14px;
        }

        /* Bottom panes */
        #result-pane {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e3e;
            overflow: hidden;
        }
        #data-pane {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            padding: 4px 10px;
            background: #252526;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            border-bottom: 1px solid #3e3e3e;
            flex-shrink: 0;
        }
        .pane-body {
            flex: 1;
            overflow: auto;
            padding: 8px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        #result-output { color: #d4d4d4; background: #1e1e1e; }
        #data-json { color: #d4d4d4; background: #1e1e1e; }
        #data-json .key { color: #9cdcfe; }
        #data-json .string { color: #ce9178; }
        #data-json .number { color: #b5cea8; }
        #data-json .bool { color: #569cd6; }
        #data-json .null { color: #569cd6; }

        /* Loading overlay */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
            z-index: 100;
            font-size: 16px;
            color: #888;
        }
        #loading.hidden { display: none; }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>

    <div id="topbar">
        <span class="label">Model:</span>
        <span class="value" id="top-idwf">{{ idwf }}</span>
        <span class="sep">|</span>
        <span class="label">Shape:</span>
        <span class="value" id="top-shape">{{ resource_id }}</span>
        <span class="sep">|</span>
        <span class="label">Case:</span>
        <span class="value" id="top-case">{{ case_id }}</span>
        <span class="sep">|</span>
        <span class="label">Language:</span>
        <select id="lang-select" title="Script language"></select>
        <button id="run-btn" class="run">Run</button>
        <button id="refresh-data-btn">Refresh Data</button>
        <span class="status" id="status"></span>
    </div>

    <div id="panes">
        <div id="editor-pane">
            <div id="editor"></div>
        </div>
        <div id="result-pane">
            <div class="pane-header">Execution Result</div>
            <div class="pane-body" id="result-output"></div>
        </div>
        <div id="data-pane">
            <div class="pane-header">Data Object</div>
            <div class="pane-body" id="data-json"></div>
        </div>
    </div>

    <script>
        window.__EDITOR_CTX = {
            idwf: "{{ idwf }}",
            case_id: "{{ case_id }}",
            resource_id: "{{ resource_id }}"
        };
    </script>
    <script src="/static/jscript/ace-builds/src-noconflict/ace.js"></script>
    <script src="/static/jscript/ace-builds/src-noconflict/ext-language_tools.js"></script>
    <script src="/static/code/code_editor.js"></script>
</body>
</html>
