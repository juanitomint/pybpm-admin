<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DNA2BPM — Sign In</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #333; }
    .login-container { max-width: 400px; margin: 120px auto; padding: 0 20px; }
    .login-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); overflow: hidden; }
    .login-header { background: #4a90d9; color: #fff; padding: 32px 32px 24px; text-align: center; }
    .login-header h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
    .login-header p { margin: 8px 0 0; opacity: 0.85; font-size: 14px; }
    .login-body { padding: 32px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #555; font-weight: 500; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; margin-bottom: 20px; transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus { outline: none; border-color: #4a90d9; box-shadow: 0 0 0 3px rgba(74,144,217,0.15); }
    .btn-submit { width: 100%; padding: 14px; background: #4a90d9; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background: #357abd; }
    .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
    .error-msg { display: none; padding: 12px 16px; margin-bottom: 20px; background: #fdf0ef; border: 1px solid #f5c6cb; border-radius: 6px; color: #d9534f; font-size: 14px; }
    .footer { text-align: center; padding: 16px; font-size: 12px; color: #999; }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>DNA2BPM</h1>
      <p>Model Browser Admin Interface</p>
    </div>
    <div class="login-body">
      <form id="login-form" method="post">
        <div id="error-msg" class="error-msg"></div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus placeholder="Enter your username" />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Enter your password" />
        <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
      </form>
    </div>
    <div class="footer">PyBPM &mdash; BPMN Model Browser</div>
  </div>
</div>

<script>
(function() {
  var form = document.getElementById('login-form');
  var btn = document.getElementById('submit-btn');
  var errorDiv = document.getElementById('error-msg');

  // If already authenticated (token in localStorage), skip login — redirect to admin.
  if (localStorage.getItem('bpm_token')) {
    window.location.href = '/admin';
    return;
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Signing in...';
    errorDiv.style.display = 'none';

    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username: username, password: password })
    })
    .then(function(resp) {
      if (!resp.ok) throw new Error('Server error: ' + resp.status);
      return resp.json();
    })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      if (!data.access_token) throw new Error('No token received from server');
      localStorage.setItem('bpm_token', data.access_token);
      window.location.href = '/admin';
    })
    .catch(function(err) {
      errorDiv.textContent = err.message || 'Login failed.';
      errorDiv.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    });
  });

  // Show error if server redirected with ?error= query param (e.g., bad credentials)
  var params = new URLSearchParams(window.location.search);
  if (params.get('error')) {
    errorDiv.textContent = decodeURIComponent(params.get('error'));
    errorDiv.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
})();
</script>

</body>
</html>
